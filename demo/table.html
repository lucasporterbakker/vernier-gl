<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vernier — drafting table</title>
<style>
  :root {
    --bg: #0e0f15; --fg: #e6edf3; --fg1: #9aa5ce;
    --line: #58a6ff; --ac: #a9c1fa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: baseline; gap: 14px; padding: 18px 22px;
    pointer-events: none; user-select: none;
  }
  nav b { font-weight: 600; letter-spacing: 0.02em; }
  nav span { color: var(--fg1); font-size: 11px; }
  #hint {
    position: fixed; left: 22px; bottom: 16px; z-index: 2;
    color: var(--fg1); font-size: 11px; letter-spacing: 0.02em;
    user-select: none; pointer-events: none;
  }
  #hint em { font-style: normal; color: var(--fg); }
  #readout, .dim {
    position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none;
    color: var(--ac); font-size: 11px; white-space: nowrap;
    opacity: 0; will-change: transform;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav><b>vernier</b><span>drafting table</span></nav>
<div id="hint"><em>click–click</em> to draft &nbsp;·&nbsp; <em>scroll</em> to tilt the sheet &nbsp;·&nbsp; <em>esc</em> flattens</div>
<div id="readout" aria-hidden="true"></div>
<div class="dim" id="dw" aria-hidden="true"></div>
<div class="dim" id="dh" aria-hidden="true"></div>
<div class="dim" id="dz" aria-hidden="true"></div>

<script type="module">
/* vernier — drafting table spike.
   Plan mode is the vernier grid: snap, measure, release — but rects persist
   as your plan. Scroll tips the sheet into perspective (ortho collapses into
   a real camera) and the plan rises into hairline wireframe volumes,
   analytically raytraced in one fragment shader. Esc flattens. */

const MAXB = 16;

const VERT = `#version 300 es
void main() {
  vec2 v = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(v * 2.0 - 1.0, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
out vec4 O;

uniform vec2  uRes;       // device px
uniform float uDpr;
uniform vec3  uEye, uFwd, uRight, uUp;
uniform vec2  uHalf;      // ortho half extents (world units)
uniform vec2  uTan;       // perspective tan half-fov (x, y)
uniform float uOrthoK;    // 1 = pure ortho plan, 0 = pure perspective
uniform vec2  uRawW;      // pointer on ground, world xy
uniform vec2  uCrossW;    // eased snap point, world xy
uniform float uEnergy;
uniform float uPulse;
uniform vec4  uMeas;      // active rect: lo.xy, hi.xy (world)
uniform float uMeasA;
uniform vec2  uBoxLo[${MAXB}];
uniform vec2  uBoxHi[${MAXB}];
uniform float uBoxH[${MAXB}];
uniform float uBoxB[${MAXB}];  // base elevation: stacked blocks rest on what's below
uniform int   uNBox;
uniform int   uHoverBox;   // -1 none
uniform int   uHoverFace;  // 1 top, 2 x-, 3 x+, 4 y-, 5 y+
uniform vec3  uBg, uLine, uAc;

// screen-px antialiased line: d = world distance, fw = its screen footprint
float lineAA(float d, float fw) { return 1.0 - smoothstep(0.5, 1.5, d / max(fw, 1e-6)); }

// grid line mask at spacing s for world coords q (fw = per-axis footprint)
float gridAA(vec2 q, float s, vec2 fw, out float moire) {
  vec2 g = abs(q / s - round(q / s)) * s;
  vec2 a = g / max(fw, vec2(1e-6));
  moire = smoothstep(2.5, 5.0, s / max(fw.x, fw.y)); // fade before cells alias
  return (1.0 - smoothstep(0.5, 1.5, min(a.x, a.y))) * moire;
}

void main() {
  vec2 ndc = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;

  // ortho plan camera morphs into a perspective one
  vec3 roP = uEye;
  vec3 rdP = normalize(uFwd + ndc.x * uTan.x * uRight + ndc.y * uTan.y * uUp);
  vec3 roO = uEye + ndc.x * uHalf.x * uRight + ndc.y * uHalf.y * uUp;
  vec3 ro = mix(roP, roO, uOrthoK);
  vec3 rd = normalize(mix(rdP, uFwd, uOrthoK));
  rd = mix(rd, vec3(1e-6), vec3(lessThan(abs(rd), vec3(1e-6))));

  // nearest hit: ground plane z=0, then each box
  float t = 1e9; int mat = -1; int bi = -1; vec3 n = vec3(0.0, 0.0, 1.0);
  if (rd.z < 0.0) { t = -ro.z / rd.z; mat = 0; }
  for (int i = 0; i < ${MAXB}; i++) {
    if (i >= uNBox) break;
    if (uBoxH[i] < 0.5) continue;   // flat plans render as footprints on the sheet
    vec3 blo = vec3(uBoxLo[i], uBoxB[i]), bhi = vec3(uBoxHi[i], uBoxB[i] + uBoxH[i]);
    vec3 inv = 1.0 / rd;
    vec3 t0 = (blo - ro) * inv, t1 = (bhi - ro) * inv;
    vec3 tmin = min(t0, t1), tmax = max(t0, t1);
    float tn = max(max(tmin.x, tmin.y), tmin.z);
    float tf = min(min(tmax.x, tmax.y), tmax.z);
    if (tn > tf || tf < 0.0 || tn <= 0.0 || tn >= t) continue;
    t = tn; mat = 1; bi = i;
    if (tmin.x > tmin.y && tmin.x > tmin.z) n = vec3(-sign(rd.x), 0.0, 0.0);
    else if (tmin.y > tmin.z) n = vec3(0.0, -sign(rd.y), 0.0);
    else n = vec3(0.0, 0.0, -sign(rd.z));
  }

  vec3 col = uBg;
  if (mat < 0) { O = vec4(col, 1.0); return; }

  vec3 p = ro + rd * t;
  // screen footprint of the world position (per world axis)
  vec2 fwXY = vec2(length(vec2(dFdx(p.x), dFdy(p.x))), length(vec2(dFdx(p.y), dFdy(p.y))));
  float fwZ = length(vec2(dFdx(p.z), dFdy(p.z)));
  float fade = exp(-max(t - uHalf.y * 1.6, 0.0) * 0.0012);

  if (mat == 0) {
    // ---- ground: the drafting sheet ----
    float pr = distance(p.xy, uRawW);
    float sigma = 180.0;
    float lift = uEnergy * exp(-(pr * pr) / (2.0 * sigma * sigma));

    // committed pane glass under the active measurement
    vec2 lo = uMeas.xy, hi = uMeas.zw;
    float inR = step(lo.x, p.x) * step(p.x, hi.x) * step(lo.y, p.y) * step(p.y, hi.y);
    float glass = inR * uMeasA;

    float m1, m2;
    float minor = gridAA(p.xy, 8.0, fwXY, m1) * (0.028 + 0.105 * lift + 0.055 * glass);
    float major = gridAA(p.xy, 64.0, fwXY, m2) * (0.060 + 0.150 * lift + 0.075 * glass);

    // vertex dots on the major grid
    vec2 gm = abs(p.xy / 64.0 - round(p.xy / 64.0)) * 64.0;
    vec2 am = gm / max(fwXY, vec2(1e-6));
    float dots = (1.0 - smoothstep(1.0, 2.2, max(am.x, am.y))) * max(lift * 0.85, glass * 0.6) * m2;

    // crosshair + handle at the eased snap point
    vec2 dcw = abs(p.xy - uCrossW);
    vec2 ac = dcw / max(fwXY, vec2(1e-6));
    float cross = (1.0 - smoothstep(0.5, 1.5, min(ac.x, ac.y))) * uEnergy * 0.20;
    float boxd = max(ac.x, ac.y);
    float ring = (1.0 - smoothstep(0.5, 1.5, abs(boxd - 7.0))) * uEnergy;
    float inner = 1.0 - smoothstep(5.5, 7.0, boxd);

    // active measurement pane: border + edge glow
    float ex = min(abs(p.x - lo.x), abs(p.x - hi.x));
    float ey = min(abs(p.y - lo.y), abs(p.y - hi.y));
    float inX = step(lo.x - 4.0, p.x) * step(p.x, hi.x + 4.0);
    float inY = step(lo.y - 4.0, p.y) * step(p.y, hi.y + 4.0);
    float mBorder = max(lineAA(ex, fwXY.x) * inY * step(lo.y, p.y) * step(p.y, hi.y),
                        lineAA(ey, fwXY.y) * inX * step(lo.x, p.x) * step(p.x, hi.x)) * uMeasA;
    float edgeIn = max(min(min(p.x - lo.x, hi.x - p.x), min(p.y - lo.y, hi.y - p.y)), 0.0);
    float glow = exp(-edgeIn / 16.0) * glass;

    // drafted footprints stay inked on the sheet
    float fpB = 0.0, fpF = 0.0;
    for (int i = 0; i < ${MAXB}; i++) {
      if (i >= uNBox) break;
      vec2 l2 = uBoxLo[i], h2 = uBoxHi[i];
      float iX = step(l2.x, p.x) * step(p.x, h2.x);
      float iY = step(l2.y, p.y) * step(p.y, h2.y);
      float ex2 = min(abs(p.x - l2.x), abs(p.x - h2.x));
      float ey2 = min(abs(p.y - l2.y), abs(p.y - h2.y));
      fpB = max(fpB, max(lineAA(ex2, fwXY.x) * iY, lineAA(ey2, fwXY.y) * iX));
      fpF = max(fpF, iX * iY);
    }

    col += (uLine * (minor + major) * (1.0 - inner * uEnergy)) * fade;
    col += uAc * fpF * 0.030;
    col += uAc * fpB * 0.40 * fade;
    col += uLine * cross * (1.0 - inner);
    col += uAc * dots * fade;
    col += uLine * lift * 0.012;
    col += uAc * glass * 0.055;
    col += uAc * glow * 0.05;
    col += uAc * mBorder * 0.55;
    col += uAc * ring * uPulse;
  } else {
    // ---- a drafted volume: graph paper wrapped around a box ----
    vec2 lo = uBoxLo[bi], hi = uBoxHi[bi];
    float h = uBoxH[bi];

    // face-local 2D coords + their screen footprints
    vec2 q, fq; float e1, e2, f1, f2;
    if (abs(n.z) > 0.5)      { q = p.xy; fq = fwXY; e1 = min(p.x - lo.x, hi.x - p.x); f1 = fwXY.x; e2 = min(p.y - lo.y, hi.y - p.y); f2 = fwXY.y; }
    else if (abs(n.x) > 0.5) { q = vec2(p.y, p.z); fq = vec2(fwXY.y, fwZ); e1 = min(p.y - lo.y, hi.y - p.y); f1 = fwXY.y; e2 = min(p.z - uBoxB[bi], uBoxB[bi] + h - p.z); f2 = fwZ; }
    else                     { q = vec2(p.x, p.z); fq = vec2(fwXY.x, fwZ); e1 = min(p.x - lo.x, hi.x - p.x); f1 = fwXY.x; e2 = min(p.z - uBoxB[bi], uBoxB[bi] + h - p.z); f2 = fwZ; }

    // faces keep the drafting grid, toned by orientation
    float shade = abs(n.z) > 0.5 ? 1.0 : (abs(n.x) > 0.5 ? 0.55 : 0.75);
    float m1, m2;
    float minor = gridAA(q, 8.0, fq, m1) * 0.050 * shade;
    float major = gridAA(q, 64.0, fq, m2) * 0.085 * shade;

    // hairline wireframe on the face boundary
    float edge = max(lineAA(e1, f1), lineAA(e2, f2));

    // hover: the box brightens, the grabbed face fills
    int faceId = abs(n.z) > 0.5 ? 1 : (n.x < -0.5 ? 2 : (n.x > 0.5 ? 3 : (n.y < -0.5 ? 4 : 5)));
    float hov = (bi == uHoverBox) ? 1.0 : 0.0;
    float hovFace = (bi == uHoverBox && faceId == uHoverFace) ? 1.0 : 0.0;

    col += uBg * 0.35 * shade;                 // faces lift off the ground
    col += uLine * (minor + major) * fade;
    col += uAc * abs(n.z) * 0.020;             // roofs catch a little accent
    col += uAc * hovFace * 0.045;
    col += uAc * edge * (0.72 + 0.28 * hov) * fade;
  }

  O = vec4(col, 1.0);
}`;

/* ---------- gl setup ---------- */

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false });
if (!gl) { document.getElementById('hint').textContent = 'WebGL2 unavailable'; throw new Error('no webgl2'); }

const compile = (type, src) => {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
};
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = {};
for (const n of ['uRes','uDpr','uEye','uFwd','uRight','uUp','uHalf','uTan','uOrthoK','uRawW','uCrossW',
                 'uEnergy','uPulse','uMeas','uMeasA','uBoxLo','uBoxHi','uBoxH','uBoxB','uNBox','uHoverBox','uHoverFace','uBg','uLine','uAc'])
  U[n] = gl.getUniformLocation(prog, n);

const hex01 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
gl.uniform3fv(U.uBg, hex01('#0e0f15'));
gl.uniform3fv(U.uLine, hex01('#58a6ff'));
gl.uniform3fv(U.uAc, hex01('#a9c1fa'));

/* ---------- state ---------- */

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const GRID = 8, TAN = 0.28;
let dpr = 1, W = 0, H = 0;
let energy = 0, lastMove = -1e9, lastT = 0, rafId = 0, running = false;

const raw = { x: -1e4, y: -1e4 };     // world xy (y-up)
const target = { x: -1e4, y: -1e4 };
const cur = { x: -1e4, y: -1e4 };
const meas = { on: false, ax: 0, ay: 0 };
const tilt = { cur: 0, tgt: 0 };
const rects = [];                     // {lo:[x,y], hi:[x,y], h}

const boxLo = new Float32Array(MAXB * 2);
const boxHi = new Float32Array(MAXB * 2);
const boxH = new Float32Array(MAXB);
const boxB = new Float32Array(MAXB);

// drafting order is build order: a rect resting on earlier footprints
// stacks on top of them — and rides along when what's below changes
function computeBases() {
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    let b = 0;
    for (let j = 0; j < i; j++) {
      const s = rects[j];
      if (r.lo[0] < s.hi[0] - 4 && r.hi[0] > s.lo[0] + 4 &&
          r.lo[1] < s.hi[1] - 4 && r.hi[1] > s.lo[1] + 4)
        b = Math.max(b, s.base + s.h);
    }
    r.base = b;
  }
}

function commitRect(hx, hy) {
  const lo = [Math.min(meas.ax, hx), Math.min(meas.ay, hy)];
  const hi = [Math.max(meas.ax, hx), Math.max(meas.ay, hy)];
  const bw = hi[0] - lo[0], bh = hi[1] - lo[1];
  if (bw >= GRID && bh >= GRID) {
    rects.push({ lo, hi, h: Math.max(24, Math.min(280, Math.min(bw, bh))), base: 0, born: performance.now() });
    if (rects.length > MAXB) rects.shift();
  }
}

const readout = document.getElementById('readout');
const dw = document.getElementById('dw'), dh = document.getElementById('dh'), dz = document.getElementById('dz');
const hint = document.getElementById('hint');
let hintTilted = false;
const snap = v => Math.round(v / GRID) * GRID;

function place(el, text, s, ox, oy) {
  if (!s) { el.style.opacity = '0'; return; }
  el.textContent = text;
  el.style.transform = `translate(${Math.round(s[0] + ox)}px, ${Math.round(s[1] + oy)}px)`;
  el.style.opacity = '0.95';
}

/* ---------- camera ---------- */

function camera(T) {
  const ease = T * T * (3 - 2 * T);
  const el = (90 - 55 * ease) * Math.PI / 180;
  const az = (-25 * ease) * Math.PI / 180;
  const P = [W / 2, H / 2, 0];
  const dist = H / (2 * TAN);
  const eye = [
    P[0] + dist * Math.sin(az) * Math.cos(el),
    P[1] - dist * Math.cos(az) * Math.cos(el),
    P[2] + dist * Math.sin(el),
  ];
  const norm = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
  const fwd = norm([P[0] - eye[0], P[1] - eye[1], P[2] - eye[2]]);
  let right;
  if (Math.abs(fwd[2]) > 0.999) right = [1, 0, 0];
  else right = norm([fwd[1] * 1 - fwd[2] * 0, fwd[2] * 0 - fwd[0] * 1, 0]); // fwd × (0,0,1)
  const up = [right[1] * fwd[2] - right[2] * fwd[1], right[2] * fwd[0] - right[0] * fwd[2], right[0] * fwd[1] - right[1] * fwd[0]];
  const orthoK = 1 - Math.min(1, Math.max(0, ease / 0.35));
  return { eye, fwd, right, up, orthoK };
}

let cam = null;
function pointerRay(cssX, cssY) {
  const c = cam || camera(tilt.cur);
  const ndcX = (cssX / W) * 2 - 1, ndcY = ((H - cssY) / H) * 2 - 1;
  const mix3 = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  const rdP = [0, 1, 2].map(i => c.fwd[i] + ndcX * TAN * (W / H) * c.right[i] + ndcY * TAN * c.up[i]);
  const roO = [0, 1, 2].map(i => c.eye[i] + ndcX * (W / 2) * c.right[i] + ndcY * (H / 2) * c.up[i]);
  const ro = mix3(c.eye, roO, c.orthoK);
  let rd = mix3(rdP, c.fwd, c.orthoK);
  const l = Math.hypot(...rd); rd = rd.map(v => v / l);
  return { ro, rd };
}
function pointerToWorld(cssX, cssY) {
  const { ro, rd } = pointerRay(cssX, cssY);
  if (rd[2] >= -1e-6) return null;
  const t = -ro[2] / rd[2];
  return { x: ro[0] + rd[0] * t, y: ro[1] + rd[1] * t };
}
function projectWorld(x, y, z) {
  const c = cam || camera(tilt.cur);
  const v = [x - c.eye[0], y - c.eye[1], z - c.eye[2]];
  const px = v[0] * c.right[0] + v[1] * c.right[1] + v[2] * c.right[2];
  const py = v[0] * c.up[0] + v[1] * c.up[1] + v[2] * c.up[2];
  const pz = v[0] * c.fwd[0] + v[1] * c.fwd[1] + v[2] * c.fwd[2];
  if (pz <= 1e-4 && c.orthoK < 0.5) return null;
  const nx = px / (Math.max(pz, 1e-4) * TAN * (W / H)), ny = py / (Math.max(pz, 1e-4) * TAN);
  const ox = px / (W / 2), oy = py / (H / 2);
  const fx = nx + (ox - nx) * c.orthoK, fy = ny + (oy - ny) * c.orthoK;
  return [(fx + 1) / 2 * W, H - (fy + 1) / 2 * H, pz];
}

/* ---------- picking + face dragging ---------- */

const hover = { box: -1, face: 0, mode: '', bound: '' };
const drag = { on: false, box: -1, mode: '', bound: '', unit: [0, 0], perUnit: 1,
               start: 0, lo0: null, hi0: null, sx: 0, sy: 0, offX: 0, offY: 0, szX: 0, szY: 0 };
const riseK = () => Math.min(1, tilt.cur * 3.2);
const EDGE_PX = 9;   // within this many screen px of a line = resize, else = move

// design-tool semantics: the middle of a face is a hand (move the shape),
// a line is a double chevron (resize along that line's axis)
function pick(cssX, cssY) {
  const { ro, rd } = pointerRay(cssX, cssY);
  let best = 1e9, box = -1, face = 0;
  const rk = riseK();
  for (let i = 0; i < rects.length; i++) {
    const eh = rects[i].h * rk;
    if (eh < 0.5) continue;
    const eb = rects[i].base * rk;
    const lo = [rects[i].lo[0], rects[i].lo[1], eb], hi = [rects[i].hi[0], rects[i].hi[1], eb + eh];
    let tn = -1e9, tf = 1e9, ax = -1, ok = true;
    for (let a = 0; a < 3; a++) {
      const d = Math.abs(rd[a]) < 1e-9 ? (rd[a] < 0 ? -1e-9 : 1e-9) : rd[a];
      let t0 = (lo[a] - ro[a]) / d, t1 = (hi[a] - ro[a]) / d;
      if (t0 > t1) { const s = t0; t0 = t1; t1 = s; }
      if (t0 > tn) { tn = t0; ax = a; }
      if (t1 < tf) tf = t1;
      if (tn > tf) { ok = false; break; }
    }
    if (!ok || tf < 0 || tn <= 0 || tn >= best) continue;
    best = tn; box = i;
    face = ax === 2 ? 1 : ax === 0 ? (rd[0] > 0 ? 2 : 3) : (rd[1] > 0 ? 4 : 5);
  }
  if (box < 0) return { box: -1, face: 0, mode: '', bound: '' };

  // classify: near a boundary line of the hit face → resize that bound
  const r = rects[box];
  const eh = r.h * rk, eb = r.base * rk;
  const p = [ro[0] + rd[0] * best, ro[1] + rd[1] * best, ro[2] + rd[2] * best];
  const pxPer = axis => {
    const s0 = projectWorld(p[0], p[1], p[2]);
    const s1 = projectWorld(p[0] + axis[0], p[1] + axis[1], p[2] + axis[2]);
    return (s0 && s1) ? Math.hypot(s1[0] - s0[0], s1[1] - s0[1]) : 0;
  };
  const X = [1, 0, 0], Y = [0, 1, 0], Z = [0, 0, 1];
  const cand = [];   // [screen px to the line, bound]
  if (face === 1) {
    const kx = pxPer(X), ky = pxPer(Y);
    cand.push([(p[0] - r.lo[0]) * kx, 'xlo'], [(r.hi[0] - p[0]) * kx, 'xhi']);
    cand.push([(p[1] - r.lo[1]) * ky, 'ylo'], [(r.hi[1] - p[1]) * ky, 'yhi']);
  } else if (face === 2 || face === 3) {
    const ky = pxPer(Y), kz = pxPer(Z);
    cand.push([(p[1] - r.lo[1]) * ky, 'ylo'], [(r.hi[1] - p[1]) * ky, 'yhi']);
    cand.push([((eb + eh) - p[2]) * kz, 'z'], [(p[2] - eb) * kz, face === 2 ? 'xlo' : 'xhi']);
  } else {
    const kx = pxPer(X), kz = pxPer(Z);
    cand.push([(p[0] - r.lo[0]) * kx, 'xlo'], [(r.hi[0] - p[0]) * kx, 'xhi']);
    cand.push([((eb + eh) - p[2]) * kz, 'z'], [(p[2] - eb) * kz, face === 4 ? 'ylo' : 'yhi']);
  }
  let bd = '', bdist = 1e9;
  for (const [d, b] of cand) if (d < bdist) { bdist = d; bd = b; }
  if (bdist < EDGE_PX) return { box, face, mode: 'resize', bound: bd, p };
  return { box, face, mode: 'move', bound: '', p };
}

// screen direction of a world axis at point p — for cursor + drag calibration
function axisOnScreen(p, axis) {
  const s0 = projectWorld(p[0], p[1], p[2]);
  const s1 = projectWorld(p[0] + axis[0] * 20, p[1] + axis[1] * 20, p[2] + axis[2] * 20);
  if (!s0 || !s1) return null;
  const dx = s1[0] - s0[0], dy = s1[1] - s0[1];
  const len = Math.hypot(dx, dy);
  return len < 1e-4 ? null : { unit: [dx / len, dy / len], perUnit: len / 20 };
}

const boundAxis = b => b === 'z' ? [0, 0, 1] : (b[0] === 'x' ? [1, 0, 0] : [0, 1, 0]);
const resizeCursor = a => !a ? '' : (Math.abs(a.unit[0]) >= Math.abs(a.unit[1]) ? 'ew-resize' : 'ns-resize');

function beginDrag(pk, sx, sy) {
  const r = rects[pk.box];
  drag.box = pk.box; drag.mode = pk.mode; drag.bound = pk.bound;
  drag.sx = sx; drag.sy = sy;
  drag.lo0 = r.lo.slice(); drag.hi0 = r.hi.slice(); drag.start = r.h;
  if (pk.mode === 'resize') {
    const a = axisOnScreen(pk.p, boundAxis(pk.bound));
    if (!a) return;
    drag.unit = a.unit; drag.perUnit = a.perUnit;
    canvas.style.cursor = resizeCursor(a);
  } else {
    const g = pointerToWorld(sx, sy);
    if (!g) return;
    drag.offX = g.x - r.lo[0]; drag.offY = g.y - r.lo[1];
    drag.szX = r.hi[0] - r.lo[0]; drag.szY = r.hi[1] - r.lo[1];
    canvas.style.cursor = 'grabbing';
  }
  drag.on = true;
}

function applyDrag(cx, cy) {
  const r = rects[drag.box];
  if (!r) { drag.on = false; return; }
  if (drag.mode === 'move') {
    const g = pointerToWorld(cx, cy);
    if (!g) return;
    r.lo[0] = snap(g.x - drag.offX); r.lo[1] = snap(g.y - drag.offY);
    r.hi[0] = r.lo[0] + drag.szX;   r.hi[1] = r.lo[1] + drag.szY;
    return;
  }
  const d = ((cx - drag.sx) * drag.unit[0] + (cy - drag.sy) * drag.unit[1]) / drag.perUnit;
  const q = Math.round(d / GRID) * GRID;
  if (drag.bound === 'z')        r.h = Math.max(GRID, Math.min(640, drag.start + q));
  else if (drag.bound === 'xlo') r.lo[0] = Math.min(drag.lo0[0] + q, r.hi[0] - GRID);
  else if (drag.bound === 'xhi') r.hi[0] = Math.max(drag.hi0[0] + q, r.lo[0] + GRID);
  else if (drag.bound === 'ylo') r.lo[1] = Math.min(drag.lo0[1] + q, r.hi[1] - GRID);
  else if (drag.bound === 'yhi') r.hi[1] = Math.max(drag.hi0[1] + q, r.lo[1] + GRID);
}

/* ---------- frame loop (render-on-demand) ---------- */

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.max(1, Math.round(W * dpr));
  canvas.height = Math.max(1, Math.round(H * dpr));
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uDpr, dpr);
  render(true);
}

function render(force, t = performance.now()) {
  rafId = 0;
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;

  const k = reduced ? 1 : 1 - Math.pow(0.0001, dt);
  cur.x += (target.x - cur.x) * k;
  cur.y += (target.y - cur.y) * k;
  tilt.cur += (tilt.tgt - tilt.cur) * (reduced ? 1 : 1 - Math.pow(0.001, dt));

  if (t - lastMove > 700) energy = Math.max(0, energy - 1.6 * dt);

  cam = camera(tilt.cur);
  gl.uniform3fv(U.uEye, cam.eye);
  gl.uniform3fv(U.uFwd, cam.fwd);
  gl.uniform3fv(U.uRight, cam.right);
  gl.uniform3fv(U.uUp, cam.up);
  gl.uniform2f(U.uHalf, W / 2, H / 2);
  gl.uniform2f(U.uTan, TAN * (W / H), TAN);
  gl.uniform1f(U.uOrthoK, cam.orthoK);
  gl.uniform2f(U.uRawW, raw.x, raw.y);
  gl.uniform2f(U.uCrossW, cur.x, cur.y);
  gl.uniform1f(U.uEnergy, energy);
  gl.uniform1f(U.uPulse, reduced ? 0.85 : 0.7 + 0.3 * Math.sin(t / 1000 * 2.6));

  if (meas.on) {
    const lo = [Math.min(meas.ax, cur.x), Math.min(meas.ay, cur.y)];
    const hi = [Math.max(meas.ax, cur.x), Math.max(meas.ay, cur.y)];
    gl.uniform4f(U.uMeas, lo[0], lo[1], hi[0], hi[1]);
    gl.uniform1f(U.uMeasA, 1);
  } else gl.uniform1f(U.uMeasA, 0);

  computeBases();
  const rk = riseK();
  let growing = false;
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    let be = 1;
    if (r.born) {
      const g = (t - r.born) / 350;
      if (g < 1) { be = g * g * (3 - 2 * g); growing = true; } else r.born = 0;
    }
    boxLo[i * 2] = r.lo[0]; boxLo[i * 2 + 1] = r.lo[1];
    boxHi[i * 2] = r.hi[0]; boxHi[i * 2 + 1] = r.hi[1];
    boxB[i] = r.base * rk;                    // stacked blocks ride their support
    boxH[i] = r.h * rk * be;                  // volumes rise with the tilt (and on birth)
  }
  gl.uniform2fv(U.uBoxLo, boxLo);
  gl.uniform2fv(U.uBoxHi, boxHi);
  gl.uniform1fv(U.uBoxH, boxH);
  gl.uniform1fv(U.uBoxB, boxB);
  gl.uniform1i(U.uNBox, rects.length);
  gl.uniform1i(U.uHoverBox, tilt.cur > 0.25 ? hover.box : -1);
  gl.uniform1i(U.uHoverFace, hover.face);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // DOM readout rides the crosshair (world → screen, any tilt)
  const m = meas.on;
  const rs = projectWorld(cur.x, cur.y, 0);
  readout.textContent = m
    ? `w: ${Math.abs(Math.round(target.x - meas.ax))} · h: ${Math.abs(Math.round(target.y - meas.ay))}`
    : `x: ${Math.round(target.x)} · y: ${Math.round(target.y)}`;
  if (rs) readout.style.transform = `translate(${Math.round(rs[0]) + 14}px, ${Math.round(rs[1]) + 16}px)`;
  readout.style.opacity = m ? '1'
    : (tilt.cur < 0.2 && energy > 0.03) ? String(Math.min(1, energy * 1.6)) : '0';

  // dimension labels on the hovered volume
  const hb = (tilt.cur > 0.25 && hover.box >= 0) ? rects[hover.box] : null;
  if (hb) {
    const eh = hb.h * riseK(), eb = hb.base * riseK();
    const cxm = (hb.lo[0] + hb.hi[0]) / 2, cym = (hb.lo[1] + hb.hi[1]) / 2;
    place(dw, `w: ${Math.round(hb.hi[0] - hb.lo[0])}`, projectWorld(cxm, hb.lo[1], eb), -18, 14);
    place(dh, `h: ${Math.round(hb.hi[1] - hb.lo[1])}`, projectWorld(hb.hi[0], cym, eb), 12, 0);
    place(dz, `z: ${Math.round(hb.h)}`, projectWorld(hb.lo[0], hb.lo[1], eb + eh / 2), -56, -6);
  } else {
    dw.style.opacity = dh.style.opacity = dz.style.opacity = '0';
  }

  // the hint follows the mode
  const tilted = tilt.cur > 0.25;
  if (tilted !== hintTilted) {
    hintTilted = tilted;
    hint.innerHTML = tilted
      ? '<em>click&ndash;click</em> drafts &nbsp;&middot;&nbsp; <em>faces</em> move &nbsp;&middot;&nbsp; <em>lines</em> resize &nbsp;&middot;&nbsp; <em>backspace</em> deletes &nbsp;&middot;&nbsp; <em>esc</em> flattens'
      : '<em>click&ndash;click</em> to draft &nbsp;&middot;&nbsp; <em>scroll</em> to tilt the sheet &nbsp;&middot;&nbsp; <em>esc</em> flattens';
  }

  const settled = Math.abs(cur.x - target.x) < 0.05 && Math.abs(cur.y - target.y) < 0.05;
  const tilting = Math.abs(tilt.cur - tilt.tgt) > 0.0015;
  if (!force && (energy > 0.004 || !settled || tilting || meas.on || growing)) schedule();
  else running = false;
}

const frame = t => render(false, t);
function schedule() { running = true; if (!rafId) rafId = requestAnimationFrame(frame); }
function kick() { if (!running) { lastT = performance.now(); schedule(); } }

/* ---------- input ---------- */

addEventListener('pointermove', e => {
  if (drag.on) {
    applyDrag(e.clientX, e.clientY);
    lastMove = performance.now();
    energy = 1;
    kick();
    return;
  }
  const w = pointerToWorld(e.clientX, e.clientY);
  if (w) {
    raw.x = w.x; raw.y = w.y;
    target.x = snap(w.x); target.y = snap(w.y);
    if (cur.x < -1e3) { cur.x = target.x; cur.y = target.y; }
  }
  if (tilt.cur > 0.25) {
    const pk = pick(e.clientX, e.clientY);
    hover.box = pk.box; hover.mode = pk.mode; hover.bound = pk.bound;
    hover.face = pk.mode === 'move' ? pk.face : 0;   // fill the face only for the hand
    canvas.style.cursor = pk.box < 0 ? ''
      : pk.mode === 'move' ? 'grab'
      : resizeCursor(axisOnScreen(pk.p, boundAxis(pk.bound)));
  } else if (hover.box !== -1) {
    hover.box = -1; hover.face = 0; hover.mode = ''; canvas.style.cursor = '';
  }
  lastMove = performance.now();
  energy = 1;
  kick();
}, { passive: true });

addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('a, button, select, input')) return;
  if (tilt.cur > 0.25) {                      // tilted: draft on the ground, sculpt on boxes
    const w = pointerToWorld(e.clientX, e.clientY);
    if (meas.on) {
      meas.on = false;
      if (w) commitRect(snap(w.x), snap(w.y));
      kick();
      return;
    }
    const pk = pick(e.clientX, e.clientY);
    if (pk.box >= 0) {
      hover.box = pk.box; hover.mode = pk.mode; hover.bound = pk.bound;
      hover.face = pk.mode === 'move' ? pk.face : 0;
      beginDrag(pk, e.clientX, e.clientY);
    } else if (w) {
      meas.on = true;
      meas.ax = snap(w.x); meas.ay = snap(w.y);
    }
    kick();
    return;
  }
  if (tilt.cur > 0.2) return;                 // mid-tilt dead zone
  const w = pointerToWorld(e.clientX, e.clientY);
  if (!w) return;
  if (!meas.on) {
    meas.on = true;
    meas.ax = snap(w.x); meas.ay = snap(w.y);
  } else {
    meas.on = false;
    commitRect(snap(w.x), snap(w.y));
  }
  kick();
}, { passive: true });

addEventListener('pointerup', () => {
  if (drag.on) {
    drag.on = false;
    canvas.style.cursor = hover.box >= 0 ? 'grab' : '';
    kick();
  }
}, { passive: true });

addEventListener('wheel', e => {
  tilt.tgt = Math.max(0, Math.min(1, tilt.tgt + e.deltaY * 0.0011));
  kick();
}, { passive: true });

addEventListener('keydown', e => {
  if ((e.key === 'Backspace' || e.key === 'Delete') && tilt.cur > 0.25 && hover.box >= 0) {
    rects.splice(hover.box, 1);
    hover.box = -1; hover.face = 0; drag.on = false;
    canvas.style.cursor = '';
    kick();
    return;
  }
  if (e.key !== 'Escape') return;
  if (meas.on) meas.on = false;
  else tilt.tgt = 0;
  kick();
});

// verification hooks (harmless in normal use)
window.__project = projectWorld;
window.__tstate = () => ({ tilt: tilt.cur, hover: { ...hover },
  rects: rects.map(r => ({ lo: r.lo.slice(), hi: r.hi.slice(), h: r.h, base: r.base || 0 })) });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (rafId) cancelAnimationFrame(rafId); rafId = 0; running = false; }
  else render(true);
});
addEventListener('resize', resize);
resize();
</script>
</body>
</html>
