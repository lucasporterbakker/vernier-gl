<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vernier — drafting table</title>
<style>
  :root {
    --bg: #0e0f15; --fg: #e6edf3; --fg1: #9aa5ce;
    --line: #58a6ff; --ac: #a9c1fa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: baseline; gap: 14px; padding: 18px 22px;
    pointer-events: none; user-select: none;
  }
  nav b { font-weight: 600; letter-spacing: 0.02em; }
  nav span { color: var(--fg1); font-size: 11px; }
  #hint {
    position: fixed; left: 22px; bottom: 16px; z-index: 2;
    color: var(--fg1); font-size: 11px; letter-spacing: 0.02em;
    user-select: none; pointer-events: none;
  }
  #hint em { font-style: normal; color: var(--fg); }
  #readout, .dim {
    position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none;
    color: var(--ac); font-size: 11px; white-space: nowrap;
    opacity: 0; will-change: transform;
  }
  .typed { color: var(--fg); border-bottom: 1px solid var(--ac); padding-bottom: 1px; }
  #gaps { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; overflow: visible; }
  #gaps line { stroke: var(--ac); stroke-width: 1; opacity: 0.8; }
  #gaps text { fill: var(--ac); font: 11px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  #gaps .flush line { stroke: var(--fg); opacity: 1; }
  #gaps .flush text { fill: var(--fg); }
  #tools { position: fixed; right: 22px; bottom: 12px; z-index: 3; display: flex; gap: 18px; }
  #tools button {
    background: none; border: 0; padding: 4px 0; margin: 0;
    color: var(--fg1); font: inherit; font-size: 11px; letter-spacing: 0.02em;
    cursor: pointer; opacity: 0.85;
  }
  #tools button:hover { color: var(--fg); opacity: 1; }
  #tools button[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav><b>vernier</b><span>drafting table</span></nav>
<div id="hint"><em>click–click</em> to draft &nbsp;·&nbsp; <em>scroll</em> to tilt the sheet &nbsp;·&nbsp; <em>esc</em> flattens</div>
<div id="readout" aria-hidden="true"></div>
<div class="dim" id="dw" aria-hidden="true"></div>
<div class="dim" id="dh" aria-hidden="true"></div>
<div class="dim" id="dz" aria-hidden="true"></div>
<svg id="gaps" aria-hidden="true"></svg>
<div id="tools"><button id="clear" type="button" aria-label="clear the sheet">&#10005; clear</button><button id="play" type="button" aria-label="watch a demo">&#9654; watch</button></div>

<script type="module">
/* vernier — drafting table, the zero-dependency edition.
   Plan mode is the vernier grid: snap, measure, release — but rects persist
   as your plan. Scroll tips the sheet into perspective (ortho collapses into
   a real camera) and the plan rises into hairline wireframe volumes,
   analytically raytraced in one fragment shader. Esc flattens.
   The model reaches the shader as a tiny float texture, so the cap is a
   number, not a uniform budget; light stays fully analytic per pixel here
   (the three.js edition bakes the ground's shadows and trims each volume's
   occluders — this one keeps the single-shader purity and pays per pixel). */

const MAXB = 96;

const VERT = `#version 300 es
void main() {
  vec2 v = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(v * 2.0 - 1.0, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
out vec4 O;

uniform vec2  uRes;       // device px
uniform float uDpr;
uniform vec3  uEye, uFwd, uRight, uUp;
uniform vec2  uHalf;      // ortho half extents (world units)
uniform vec2  uTan;       // perspective tan half-fov (x, y)
uniform float uOrthoK;    // 1 = pure ortho plan, 0 = pure perspective
uniform vec2  uRawW;      // pointer on ground, world xy
uniform vec2  uCrossW;    // eased snap point, world xy
uniform float uEnergy;
uniform float uPulse;
uniform vec4  uMeas;      // active rect: lo.xy, hi.xy (world)
uniform float uMeasA;
uniform highp sampler2D uBoxTex;   // texel (i,0) = lo.xy hi.xy, (i,1) = base, height
uniform int   uNBox;
uniform int   uHoverBox;   // -1 none
uniform int   uHoverFace;  // 1 top, 2 x-, 3 x+, 4 y-, 5 y+
uniform vec3  uBg, uLine, uAc;

vec4 boxXY(int i) { return texelFetch(uBoxTex, ivec2(i, 0), 0); }
vec2 boxZ(int i)  { return texelFetch(uBoxTex, ivec2(i, 1), 0).xy; }

// screen-px antialiased line: d = world distance, fw = its screen footprint
float lineAA(float d, float fw) { return 1.0 - smoothstep(0.5, 1.5, d / max(fw, 1e-6)); }

// a fixed pleasant sun (normalized), high and slightly behind-left
const vec3 SUN = vec3(-0.4006, -0.2504, 0.8814);

// soft directional shadow of one volume onto a receiving point
float boxShadow(vec3 p, vec3 blo, vec3 bhi) {
  float t0 = (blo.z - p.z) / SUN.z, t1 = (bhi.z - p.z) / SUN.z;
  if (t1 <= 0.001) return 1.0;      // occluder entirely below the ray
  t0 = max(t0, 0.0);
  float tm = (t0 + t1) * 0.5;
  vec2 q = p.xy + SUN.xy * tm;
  vec2 dxy = max(blo.xy - q, q - bhi.xy);
  float d = max(dxy.x, dxy.y);      // <0: inside the shadow column
  float w = 3.0 + tm * 0.16;        // penumbra widens with travel
  return mix(0.45, 1.0, smoothstep(-0.25 * w, w, d));
}

// contact occlusion where a plate rests on a receiver: the ground, or a top face
float contactAO(vec2 p, vec2 lo, vec2 hi) {
  vec2 d = max(lo - p, p - hi);
  return 0.80 + 0.20 * smoothstep(0.0, 16.0, max(d.x, d.y));
}

// grid line mask at spacing s for world coords q (fw = per-axis footprint)
float gridAA(vec2 q, float s, vec2 fw, out float moire) {
  vec2 g = abs(q / s - round(q / s)) * s;
  vec2 a = g / max(fw, vec2(1e-6));
  moire = smoothstep(2.5, 5.0, s / max(fw.x, fw.y)); // fade before cells alias
  return (1.0 - smoothstep(0.5, 1.5, min(a.x, a.y))) * moire;
}

// rulers: the pane's edges are scales — a tick every minor, a longer one every major
float rulers(vec2 p, vec2 lo, vec2 hi, vec2 fw) {
  vec2 gmin = abs(p / 8.0 - round(p / 8.0)) * 8.0;
  vec2 gmaj = abs(p / 64.0 - round(p / 64.0)) * 64.0;
  vec2 len = mix(vec2(3.0), vec2(6.0), step(gmaj, vec2(0.5)));
  float nearX = step(lo.y, p.y) * step(p.y, lo.y + len.x) + step(hi.y - len.x, p.y) * step(p.y, hi.y);
  float nearY = step(lo.x, p.x) * step(p.x, lo.x + len.y) + step(hi.x - len.y, p.x) * step(p.x, hi.x);
  float inX = step(lo.x, p.x) * step(p.x, hi.x), inY = step(lo.y, p.y) * step(p.y, hi.y);
  float tx = lineAA(gmin.x, fw.x) * min(nearX, 1.0) * inX;
  float ty = lineAA(gmin.y, fw.y) * min(nearY, 1.0) * inY;
  float moire = smoothstep(2.5, 5.0, 8.0 / max(fw.x, fw.y));
  return max(tx, ty) * moire;
}

void main() {
  vec2 ndc = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;

  // ortho plan camera morphs into a perspective one
  vec3 roP = uEye;
  vec3 rdP = normalize(uFwd + ndc.x * uTan.x * uRight + ndc.y * uTan.y * uUp);
  vec3 roO = uEye + ndc.x * uHalf.x * uRight + ndc.y * uHalf.y * uUp;
  vec3 ro = mix(roP, roO, uOrthoK);
  vec3 rd = normalize(mix(rdP, uFwd, uOrthoK));
  rd = mix(rd, vec3(1e-6), vec3(lessThan(abs(rd), vec3(1e-6))));

  // nearest hit: ground plane z=0, then each box
  float t = 1e9; int mat = -1; int bi = -1; vec3 n = vec3(0.0, 0.0, 1.0);
  if (rd.z < 0.0) { t = -ro.z / rd.z; mat = 0; }
  vec3 inv = 1.0 / rd;
  for (int i = 0; i < uNBox; i++) {
    vec2 z = boxZ(i);
    if (z.y < 0.5) continue;   // flat plans render as footprints on the sheet
    vec4 b = boxXY(i);
    vec3 blo = vec3(b.xy, z.x), bhi = vec3(b.zw, z.x + z.y);
    vec3 t0 = (blo - ro) * inv, t1 = (bhi - ro) * inv;
    vec3 tmin = min(t0, t1), tmax = max(t0, t1);
    float tn = max(max(tmin.x, tmin.y), tmin.z);
    float tf = min(min(tmax.x, tmax.y), tmax.z);
    if (tn > tf || tf < 0.0 || tn <= 0.0 || tn >= t) continue;
    t = tn; mat = 1; bi = i;
    if (tmin.x > tmin.y && tmin.x > tmin.z) n = vec3(-sign(rd.x), 0.0, 0.0);
    else if (tmin.y > tmin.z) n = vec3(0.0, -sign(rd.y), 0.0);
    else n = vec3(0.0, 0.0, -sign(rd.z));
  }

  vec3 col = uBg;
  if (mat < 0) { O = vec4(col, 1.0); return; }

  vec3 p = ro + rd * t;
  // screen footprint of the world position (per world axis)
  vec2 fwXY = vec2(length(vec2(dFdx(p.x), dFdy(p.x))), length(vec2(dFdx(p.y), dFdy(p.y))));
  float fwZ = length(vec2(dFdx(p.z), dFdy(p.z)));
  float fade = exp(-max(t - uHalf.y * 1.6, 0.0) * 0.0012);

  if (mat == 0) {
    // ---- ground: the drafting sheet ----
    float pr = distance(p.xy, uRawW);
    float sigma = 180.0;
    float lift = uEnergy * exp(-(pr * pr) / (2.0 * sigma * sigma));

    // committed pane glass under the active measurement
    vec2 lo = uMeas.xy, hi = uMeas.zw;
    float inR = step(lo.x, p.x) * step(p.x, hi.x) * step(lo.y, p.y) * step(p.y, hi.y);
    float glass = inR * uMeasA;

    float m1, m2;
    float minor = gridAA(p.xy, 8.0, fwXY, m1) * (0.028 + 0.105 * lift + 0.055 * glass);
    float major = gridAA(p.xy, 64.0, fwXY, m2) * (0.060 + 0.150 * lift + 0.075 * glass);

    // vertex dots on the major grid
    vec2 gm = abs(p.xy / 64.0 - round(p.xy / 64.0)) * 64.0;
    vec2 am = gm / max(fwXY, vec2(1e-6));
    float dots = (1.0 - smoothstep(1.0, 2.2, max(am.x, am.y))) * max(lift * 0.85, glass * 0.6) * m2;

    // crosshair + handle at the eased snap point
    vec2 dcw = abs(p.xy - uCrossW);
    vec2 ac = dcw / max(fwXY, vec2(1e-6));
    float cross = (1.0 - smoothstep(0.5, 1.5, min(ac.x, ac.y))) * uEnergy * 0.20;
    float boxd = max(ac.x, ac.y);
    float ring = (1.0 - smoothstep(0.5, 1.5, abs(boxd - 7.0))) * uEnergy;
    float inner = 1.0 - smoothstep(5.5, 7.0, boxd);

    // active measurement pane: border, rulers, edge glow
    float ex = min(abs(p.x - lo.x), abs(p.x - hi.x));
    float ey = min(abs(p.y - lo.y), abs(p.y - hi.y));
    float inX = step(lo.x - 4.0, p.x) * step(p.x, hi.x + 4.0);
    float inY = step(lo.y - 4.0, p.y) * step(p.y, hi.y + 4.0);
    float mBorder = max(lineAA(ex, fwXY.x) * inY * step(lo.y, p.y) * step(p.y, hi.y),
                        lineAA(ey, fwXY.y) * inX * step(lo.x, p.x) * step(p.x, hi.x)) * uMeasA;
    float mRuler = rulers(p.xy, lo, hi, fwXY) * uMeasA;
    float edgeIn = max(min(min(p.x - lo.x, hi.x - p.x), min(p.y - lo.y, hi.y - p.y)), 0.0);
    float glow = exp(-edgeIn / 16.0) * glass;

    // drafted footprints stay inked on the sheet — but the ink of an
    // elevated block leaves the ground as the sheet tilts
    float fpB = 0.0, fpF = 0.0;
    for (int i = 0; i < uNBox; i++) {
      float ink = boxZ(i).x < 0.5 ? 1.0 : uOrthoK;
      if (ink < 0.01) continue;
      vec4 b = boxXY(i);
      float iX = step(b.x, p.x) * step(p.x, b.z);
      float iY = step(b.y, p.y) * step(p.y, b.w);
      float ex2 = min(abs(p.x - b.x), abs(p.x - b.z));
      float ey2 = min(abs(p.y - b.y), abs(p.y - b.w));
      fpB = max(fpB, max(lineAA(ex2, fwXY.x) * iY, lineAA(ey2, fwXY.y) * iX) * ink);
      fpF = max(fpF, iX * iY * ink);
    }

    // the paper and its ink receive the light...
    col += (uLine * (minor + major) * (1.0 - inner * uEnergy)) * fade;
    col += uAc * fpF * 0.030;
    col += uAc * fpB * 0.40 * fade;
    col += uAc * dots * fade;
    col += uLine * lift * 0.012;
    col += uAc * glass * 0.055;
    col += uAc * glow * 0.05;

    // ...as soft shadows and contact occlusion from the volumes
    float sh = 1.0, ao = 1.0;
    for (int i = 0; i < uNBox; i++) {
      vec2 z = boxZ(i);
      if (z.y < 0.5) continue;
      vec4 b = boxXY(i);
      sh = min(sh, boxShadow(p, vec3(b.xy, z.x), vec3(b.zw, z.x + z.y)));
      if (z.x < 0.5) ao *= contactAO(p.xy, b.xy, b.zw);
    }
    col *= mix(1.0, sh, 0.88) * ao;

    // instrument chrome stays above the light
    col += uLine * cross * (1.0 - inner);
    col += uAc * mBorder * 0.55;
    col += uAc * mRuler * 0.50;
    col += uAc * ring * uPulse;
  } else {
    // ---- a drafted volume: graph paper wrapped around a box ----
    vec4 bb = boxXY(bi); vec2 bz = boxZ(bi);
    vec2 lo = bb.xy, hi = bb.zw;
    float base = bz.x, h = bz.y, top = base + h;

    // face-local 2D coords + their screen footprints
    vec2 q, fq; float e1, e2, f1, f2;
    if (abs(n.z) > 0.5)      { q = p.xy; fq = fwXY; e1 = min(p.x - lo.x, hi.x - p.x); f1 = fwXY.x; e2 = min(p.y - lo.y, hi.y - p.y); f2 = fwXY.y; }
    else if (abs(n.x) > 0.5) { q = vec2(p.y, p.z); fq = vec2(fwXY.y, fwZ); e1 = min(p.y - lo.y, hi.y - p.y); f1 = fwXY.y; e2 = min(p.z - base, top - p.z); f2 = fwZ; }
    else                     { q = vec2(p.x, p.z); fq = vec2(fwXY.x, fwZ); e1 = min(p.x - lo.x, hi.x - p.x); f1 = fwXY.x; e2 = min(p.z - base, top - p.z); f2 = fwZ; }

    // faces keep the drafting grid, toned by orientation
    float m1, m2;
    float minor = gridAA(q, 8.0, fq, m1) * 0.050;
    float major = gridAA(q, 64.0, fq, m2) * 0.085;

    // hairline wireframe on the face boundary
    float edge = max(lineAA(e1, f1), lineAA(e2, f2));

    // hover: the box brightens, the grabbed face fills
    int faceId = abs(n.z) > 0.5 ? 1 : (n.x < -0.5 ? 2 : (n.x > 0.5 ? 3 : (n.y < -0.5 ? 4 : 5)));
    float hov = (bi == uHoverBox) ? 1.0 : 0.0;
    float hovFace = (bi == uHoverBox && faceId == uHoverFace) ? 1.0 : 0.0;

    // faces take the sun: lambert tone, soft shadows from the other volumes,
    // and a plate resting on a top face shades the paper under it
    float lam = 0.35 + 0.65 * max(dot(n, SUN), 0.0);
    float sh = 1.0, ao = 1.0;
    for (int i = 0; i < uNBox; i++) {
      if (i == bi) continue;
      vec2 z = boxZ(i);
      if (z.y < 0.5) continue;
      vec4 b = boxXY(i);
      sh = min(sh, boxShadow(p + n * 0.5, vec3(b.xy, z.x), vec3(b.zw, z.x + z.y)));
      if (n.z > 0.5 && abs(z.x - top) < 1.0) ao *= contactAO(p.xy, b.xy, b.zw);
    }
    vec3 fcol = uBg * 0.35 + uLine * (minor + major) * fade + uAc * abs(n.z) * 0.020;
    col += fcol * lam * mix(1.0, sh, 0.85) * ao;

    // drafting ink stays crisp above the light
    col += uAc * hovFace * 0.045;
    col += uAc * edge * (0.72 + 0.28 * hov) * fade;
  }

  O = vec4(col, 1.0);
}`;

/* ---------- gl setup ---------- */

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false });
if (!gl) { document.getElementById('hint').textContent = 'WebGL2 unavailable'; throw new Error('no webgl2'); }

const compile = (type, src) => {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
};
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = {};
for (const n of ['uRes','uDpr','uEye','uFwd','uRight','uUp','uHalf','uTan','uOrthoK','uRawW','uCrossW',
                 'uEnergy','uPulse','uMeas','uMeasA','uBoxTex','uNBox','uHoverBox','uHoverFace','uBg','uLine','uAc'])
  U[n] = gl.getUniformLocation(prog, n);

const hex01 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
gl.uniform3fv(U.uBg, hex01('#0e0f15'));
gl.uniform3fv(U.uLine, hex01('#58a6ff'));
gl.uniform3fv(U.uAc, hex01('#a9c1fa'));

// the model rides in a 64×2 float texture: row 0 = footprints, row 1 = base, height
const boxData = new Float32Array(MAXB * 2 * 4);
const boxTex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, boxTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, MAXB, 2, 0, gl.RGBA, gl.FLOAT, boxData);
gl.uniform1i(U.uBoxTex, 0);

/* ---------- state ---------- */

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const GRID = 8, TAN = 0.28;
let dpr = 1, W = 0, H = 0;
let energy = 0, lastMove = -1e9, lastT = 0, rafId = 0, running = false;

const raw = { x: -1e4, y: -1e4 };     // world xy (y-up)
const target = { x: -1e4, y: -1e4 };
const cur = { x: -1e4, y: -1e4 };
const meas = { on: false, ax: 0, ay: 0 };
const tilt = { cur: 0, tgt: 0 };
const zoom = { cur: 1, tgt: 1 };   // pinch: pull back as the block grows
const orbit = { cur: 0, tgt: 0 };  // sideways scroll: walk around the model
const rects = [];                     // {lo:[x,y], hi:[x,y], h}
const entry = { buf: ['', ''], field: 0 };   // a typed dimension, mid-gesture

// drafting order is build order: a rect resting on earlier footprints
// stacks on top of them — and rides along when what's below changes
function computeBases() {
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    const area = (r.hi[0] - r.lo[0]) * (r.hi[1] - r.lo[1]);
    let b = 0;
    for (let j = 0; j < i; j++) {
      const s = rects[j];
      const ov = Math.max(0, Math.min(r.hi[0], s.hi[0]) - Math.max(r.lo[0], s.lo[0]))
               * Math.max(0, Math.min(r.hi[1], s.hi[1]) - Math.max(r.lo[1], s.lo[1]));
      // only rects mostly on a support stack; glancing overlaps interpenetrate
      if (ov > 0.55 * area) b = Math.max(b, s.base + s.h);
    }
    r.base = b;
  }
}

function commitRect(hx, hy) {
  const lo = [Math.min(meas.ax, hx), Math.min(meas.ay, hy)];
  const hi = [Math.max(meas.ax, hx), Math.max(meas.ay, hy)];
  const bw = hi[0] - lo[0], bh = hi[1] - lo[1];
  if (bw >= GRID && bh >= GRID) {
    checkpoint();
    rects.push({ lo, hi, h: Math.max(24, Math.min(280, Math.min(bw, bh))), base: 0, born: performance.now() });
    if (rects.length > MAXB) rects.shift();
    persist();
  }
}

/* ---------- share links, undo, persistence ---------- */

const STORE_KEY = 'vernier-table';
let quiet = false;   // the in-page demo draws without touching the address bar or storage

// the whole drawing as grid-unit integers: "x.y.w.h.z" per box, "_"-joined
function serialize() {
  return rects.map(r => [r.lo[0] / GRID, r.lo[1] / GRID,
    (r.hi[0] - r.lo[0]) / GRID, (r.hi[1] - r.lo[1]) / GRID, r.h / GRID]
    .map(Math.round).join('.')).join('_');
}

function deserialize(s) {
  if (!s) return null;
  const out = [];
  for (const tok of s.split('_')) {
    const v = tok.split('.').map(Number);
    if (v.length !== 5 || !v.every(Number.isFinite)) return null;
    const [x, y, w, h, z] = v;
    if (w < 1 || h < 1) return null;

const readout = document.getElementById('readout');

/* ---------- camera ---------- */

function camera(T) {

    P[0] + dist * Math.sin(az) * Math.cos(el),
    P[1] - dist * Math.cos(az) * Math.cos(el),
    P[2] + dist * Math.sin(el),

  const fwd = norm([P[0] - eye[0], P[1] - eye[1], P[2] - eye[2]]);

  if (Math.abs(fwd[2]) > 0.999) right = [1, 0, 0];
  else right = norm([fwd[1] * 1 - fwd[2] * 0, fwd[2] * 0 - fwd[0] * 1, 0]); // fwd × (0,0,1)
  const up = [right[1] * fwd[2] - right[2] * fwd[1], right[2] * fwd[0] - right[0] * fwd[2], right[0] * fwd[1] - right[1] * fwd[0]];
  const orthoK = 1 - Math.min(1, Math.max(0, ease / 0.35));
  return { eye, fwd, right, up, orthoK,

}

let cam = null;
function pointerRay(cssX, cssY) {
  const c = cam || camera(tilt.cur);
  const ndcX = (cssX / W) * 2 - 1, ndcY = ((H - cssY) / H) * 2 - 1;
  const mix3 = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  const rdP = [0, 1, 2].map(i => c.fwd[i] + ndcX * c.tanW * c.right[i] + ndcY * c.tanH * c.up[i]);
  const roO = [0, 1, 2].map(i => c.eye[i] + ndcX * c.halfW * c.right[i] + ndcY * c.halfH * c.up[i]);
  const ro = mix3(c.eye, roO, c.orthoK);

}

  return { x: ro[0] + rd[0] * t, y: ro[1] + rd[1] * t };
}

  const px = v[0] * c.right[0] + v[1] * c.right[1] + v[2] * c.right[2];
  const py = v[0] * c.up[0] + v[1] * c.up[1] + v[2] * c.up[2];
  const pz = v[0] * c.fwd[0] + v[1] * c.fwd[1] + v[2] * c.fwd[2];
  if (pz <= 1e-4 && c.orthoK < 0.5) return null;
  const nx = px / (Math.max(pz, 1e-4) * c.tanW), ny = py / (Math.max(pz, 1e-4) * c.tanH);

  const fx = nx + (ox - nx) * c.orthoK, fy = ny + (oy - ny) * c.orthoK;

/* ---------- picking + face dragging ---------- */

  if (face === 1) {

function applyDrag(cx, cy) {

    const g = pointerToWorld(cx, cy);
    if (!g) return;

  }
  const d = ((cx - drag.sx) * drag.unit[0] + (cy - drag.sy) * drag.unit[1]) / drag.perUnit;

  else if (drag.bound === 'xlo') r.lo[0] = Math.min(drag.lo0[0] + q, r.hi[0] - GRID);

/* ---------- typed dimensions: the keyboard is the caliper's second jaw ---------- */

}

    const sx = target.x >= meas.ax ? 1 : -1, sy = target.y >= meas.ay ? 1 : -1;
    const hx = vals[0] === null ? target.x : meas.ax + sx * Math.min(4096, vals[0]);

/* ---------- gap dimensions: clearance to the nearest neighbour while moving ---------- */

  const z = r.base * riseK();

  for (let j = 0; j < rects.length; j++) {
    if (j === drag.box) continue;

      + `<line x1="${f(ticks[0][0])}" y1="${f(ticks[0][1])}" x2="${f(ticks[1][0])}" y2="${f(ticks[1][1])}"/>`
      + `<line x1="${f(ticks[2][0])}" y1="${f(ticks[2][1])}" x2="${f(ticks[3][0])}" y2="${f(ticks[3][1])}"/>`

/* ---------- frame loop (render-on-demand) ---------- */

function resize() {

  }
  sig += rects.length * 1e6;
  if (sig !== lastSig) {   // the model changed: re-upload it
    lastSig = sig;
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, MAXB, 2, gl.RGBA, gl.FLOAT, boxData);
  }
  gl.uniform1i(U.uNBox, rects.length);
  gl.uniform1i(U.uHoverBox, tilt.cur > 0.25 ? hover.box : -1);
  gl.uniform1i(U.uHoverFace, hover.face);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // DOM readout rides the crosshair (world → screen, any tilt)
  const m = meas.on;
  const rs = projectWorld(cur.x, cur.y, 0);
  if (m) {
    const wv = Math.abs(Math.round(target.x - meas.ax)), hv = Math.abs(Math.round(target.y - meas.ay));
    if (entryActive()) readout.innerHTML = `w: ${(entry.buf[0] || entry.field === 0) ? typed(0) : wv} · h: ${(entry.buf[1] || entry.field === 1) ? typed(1) : hv}`;
    else readout.textContent = `w: ${wv} · h: ${hv}`;
  } else readout.textContent = `x: ${Math.round(target.x)} · y: ${Math.round(target.y)}`;
  if (rs) readout.style.transform = `translate(${Math.round(rs[0]) + 14}px, ${Math.round(rs[1]) + 16}px)`;
  readout.style.opacity = m ? '1'
    : (tilt.cur < 0.2 && energy > 0.03) ? String(Math.min(1, energy * 1.6)) : '0';

  // dimension labels on the hovered volume (the one being typed into is underlined)
  const hb = (tilt.cur > 0.25 && hover.box >= 0) ? rects[hover.box] : null;
  if (hb) {
    const eh = hb.h * riseK(), eb = hb.base * riseK();
    const cxm = (hb.lo[0] + hb.hi[0]) / 2, cym = (hb.lo[1] + hb.hi[1]) / 2;
    const em = entryMode();
    const tb = (entryActive() && (em === 'resize' || em === 'hover')) ? (em === 'resize' ? drag.bound : hover.bound) : '';
    const lab = (b, key, v) => tb && (tb === 'z' ? b === 'z' : tb[0] === b) ? [`${key}: ${typed(0)}`, true] : [`${key}: ${v}`, false];
    const [tw, hw] = lab('x', 'w', Math.round(hb.hi[0] - hb.lo[0]));
    const [th, hh] = lab('y', 'h', Math.round(hb.hi[1] - hb.lo[1]));
    const [tz, hz] = lab('z', 'z', Math.round(hb.h));
    place(dw, tw, projectWorld(cxm, hb.lo[1], eb), -18, 14, hw);
    place(dh, th, projectWorld(hb.hi[0], cym, eb), 12, 0, hh);
    // a move is about clearance, not height: the gap dimensions take the corner
    place(dz, tz, (drag.on && drag.mode === 'move') ? null : projectWorld(hb.lo[0], hb.lo[1], eb + eh / 2), -56, -6, hz);
  } else {
    dw.style.opacity = dh.style.opacity = dz.style.opacity = '0';
  }
  gapDims();

  // the hint follows the mode (the demo narrates through the same line)
  const tilted = tilt.cur > 0.25;
  if (hintOverride !== null) {
    if (hint.innerHTML !== hintOverride) hint.innerHTML = hintOverride;
    hintTilted = null;
  } else if (tilted !== hintTilted) {
    hintTilted = tilted;
    hint.innerHTML = tilted
      ? '<em>click&ndash;click</em> drafts &nbsp;&middot;&nbsp; <em>faces</em> move &nbsp;&middot;&nbsp; <em>lines</em> resize &nbsp;&middot;&nbsp; <em>type</em> a size &nbsp;&middot;&nbsp; <em>arrows</em> nudge &nbsp;&middot;&nbsp; <em>swipe</em> orbits &nbsp;&middot;&nbsp; <em>backspace</em> deletes &nbsp;&middot;&nbsp; <em>esc</em> flattens'
      : '<em>click&ndash;click</em> to draft &nbsp;&middot;&nbsp; <em>type</em> w &times; h &nbsp;&middot;&nbsp; <em>scroll</em> to tilt &nbsp;&middot;&nbsp; <em>pinch</em> to zoom &nbsp;&middot;&nbsp; <em>&#8984;z</em> undoes &nbsp;&middot;&nbsp; <em>url</em> is a share link';
  }

  const settled = Math.abs(cur.x - target.x) < 0.05 && Math.abs(cur.y - target.y) < 0.05;
  const tilting = Math.abs(tilt.cur - tilt.tgt) > 0.0015;
  const zooming = Math.abs(zoom.cur - zoom.tgt) > 0.0015;
  const orbiting = Math.abs(orbit.cur - orbit.tgt) > 0.0015;
  if (!force && (energy > 0.004 || !settled || tilting || zooming || orbiting || meas.on || growing)) schedule();
  else running = false;
}

const frame = t => render(false, t);
function schedule() { running = true; if (!rafId) rafId = requestAnimationFrame(frame); }
function kick() { if (!running) { lastT = performance.now(); schedule(); } }

/* ---------- input ---------- */

addEventListener('pointermove', e => {
  if (drag.on) {
    applyDrag(e.clientX, e.clientY);
    lastMove = performance.now();
    energy = 1;
    kick();
    return;
  }
  const w = pointerToWorld(e.clientX, e.clientY);
  if (w) {
    raw.x = w.x; raw.y = w.y;
    target.x = snap(w.x); target.y = snap(w.y);
    if (cur.x < -1e3) { cur.x = target.x; cur.y = target.y; }
  }
  if (tilt.cur > 0.25) {
    const pk = pick(e.clientX, e.clientY);
    if (pk.box !== hover.box || pk.bound !== hover.bound) clearEntry();
    hover.box = pk.box; hover.mode = pk.mode; hover.bound = pk.bound;
    hover.face = pk.mode === 'move' ? pk.face : 0;   // fill the face only for the hand
    canvas.style.cursor = pk.box < 0 ? ''
      : pk.mode === 'move' ? 'grab'
      : resizeCursor(axisOnScreen(pk.p, boundAxis(pk.bound)));
  } else if (hover.box !== -1) {
    hover.box = -1; hover.face = 0; hover.mode = ''; canvas.style.cursor = '';
  }
  lastMove = performance.now();
  energy = 1;
  kick();
}, { passive: true });

addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('a, button, select, input')) return;
  clearEntry();
  if (tilt.cur > 0.25) {                      // tilted: draft on the ground, sculpt on boxes
    const w = pointerToWorld(e.clientX, e.clientY);
    if (meas.on) {
      meas.on = false;
      if (w) commitRect(snap(w.x), snap(w.y));
      kick();
      return;
    }
    const pk = pick(e.clientX, e.clientY);
    if (pk.box >= 0) {
      hover.box = pk.box; hover.mode = pk.mode; hover.bound = pk.bound;
      hover.face = pk.mode === 'move' ? pk.face : 0;
      beginDrag(pk, e.clientX, e.clientY);
    } else if (w) {
      meas.on = true;
      meas.ax = snap(w.x); meas.ay = snap(w.y);
    }
    kick();
    return;
  }
  if (tilt.cur > 0.2) return;                 // mid-tilt dead zone
  const w = pointerToWorld(e.clientX, e.clientY);
  if (!w) return;
  if (!meas.on) {
    meas.on = true;
    meas.ax = snap(w.x); meas.ay = snap(w.y);
  } else {
    meas.on = false;
    commitRect(snap(w.x), snap(w.y));
  }
  kick();
}, { passive: true });

addEventListener('pointerup', () => {
  if (drag.on) {
    drag.on = false;
    clearEntry();
    canvas.style.cursor = hover.box >= 0 ? 'grab' : '';
    persist();
    kick();
  }
}, { passive: true });

addEventListener('wheel', e => {
  e.preventDefault();   // keep the browser's own pinch-zoom out of it
  if (e.ctrlKey) {      // trackpad pinch arrives as ctrl+wheel
    zoom.tgt = Math.max(0.45, Math.min(2.4, zoom.tgt * Math.exp(-e.deltaY * 0.012)));
  } else if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    orbit.tgt += e.deltaX * 0.0035;   // sideways: walk around the model
  } else {
    tilt.tgt = Math.max(0, Math.min(1, tilt.tgt + e.deltaY * 0.0011));
  }
  persist();   // the address bar carries the view too
  kick();
}, { passive: false });

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) {
    if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    return;
  }
  const mode = entryMode();
  if (mode) {
    if (/^[0-9]$/.test(e.key)) {
      if (entry.buf[entry.field].length < 4) entry.buf[entry.field] += e.key;
      kick();
      return;
    }
    if (mode === 'draft' && (e.key === 'x' || e.key === 'X' || e.key === ',' || e.key === ' ' || e.key === 'Tab')) {
      e.preventDefault();
      entry.field = 1;
      kick();
      return;
    }
    if (e.key === 'Enter') { e.preventDefault(); applyEntry(); return; }
    if (e.key === 'Backspace' && entryActive()) {
      if (entry.field === 1 && entry.buf[1] === '') entry.field = 0;
      entry.buf[entry.field] = entry.buf[entry.field].slice(0, -1);
      kick();
      return;
    }
    if (e.key === 'Escape' && entryActive()) { clearEntry(); kick(); return; }
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (nudge(e.key, e.shiftKey)) e.preventDefault();
    return;
  }
  if ((e.key === 'Backspace' || e.key === 'Delete') && tilt.cur > 0.25 && hover.box >= 0 && !drag.on) {
    checkpoint();
    rects.splice(hover.box, 1);
    hover.box = -1; hover.face = 0; drag.on = false;
    canvas.style.cursor = '';
    persist();
    kick();
    return;
  }
  if (e.key !== 'Escape') return;
  if (meas.on) meas.on = false;
  else if (tilt.tgt > 0.01) tilt.tgt = 0;
  else zoom.tgt = 1;
  kick();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (rafId) cancelAnimationFrame(rafId); rafId = 0; running = false; }
  else render(true);
});
addEventListener('resize', resize);

// a clean sheet, one undo step away
document.getElementById('clear').addEventListener('click', () => {
  if (!rects.length) return;
  checkpoint();
  rects.length = 0;
  hover.box = -1; hover.face = 0; hover.mode = ''; drag.on = false; meas.on = false;
  canvas.style.cursor = '';
  clearEntry();
  persist();
  kick();
});

// restore a shared link, else last session's drawing
const fromLink = (() => {
  const dm = location.hash.match(/d=([^&]*)/);
  let list = dm && deserialize(decodeURIComponent(dm[1]));
  const linked = !!(list && list.length);
  if (!list) { try { list = deserialize(localStorage.getItem(STORE_KEY)); } catch (e) { /* ignore */ } }
  if (list && list.length) for (const r of list) rects.push(r);
  const vm = location.hash.match(/v=([^&]+)/);
  if (vm) {
    const [t, o, z] = vm[1].split(',').map(Number);
    if (Number.isFinite(t)) tilt.tgt = Math.max(0, Math.min(1, t));
    if (Number.isFinite(o)) orbit.tgt = o;
    if (Number.isFinite(z)) zoom.tgt = Math.max(0.45, Math.min(2.4, z));
  }
  return linked;
})();

resize();
kick();   // a restored view (tilt/orbit/zoom targets) animates in on its own

// the table's public face: the in-page demo (drive.js) and the
// verification harness drive it through here
window.__table = {
  canvas,
  fromLink,
  empty: () => rects.length === 0,
  size: () => [W, H],
  project: projectWorld,
  ground: pointerToWorld,
  state: () => ({
    tilt: tilt.cur, tiltTgt: tilt.tgt, zoom: zoom.cur, orbit: orbit.cur, orbitTgt: orbit.tgt, meas: meas.on,
    hover: { ...hover },
    drag: { on: drag.on, box: drag.box, mode: drag.mode, bound: drag.bound, unit: drag.unit.slice(), perUnit: drag.perUnit, sx: drag.sx, sy: drag.sy },
    entry: { buf: entry.buf.slice(), field: entry.field },
    rects: rects.map(r => ({ lo: r.lo.slice(), hi: r.hi.slice(), h: r.h, base: r.base || 0 })),
    undo: hist.length, redo: redoStack.length,
  }),
  snapshot: () => ({ d: serialize(), v: [tilt.tgt, orbit.tgt, zoom.tgt], hist: hist.slice(), redo: redoStack.slice() }),
  restore: s => {
    hist.length = 0; hist.push(...s.hist);
    redoStack.length = 0; redoStack.push(...s.redo);
    tilt.tgt = s.v[0]; orbit.tgt = s.v[1]; zoom.tgt = s.v[2];
    restoreList(s.d);
  },
  clear: () => { rects.length = 0; hover.box = -1; hover.face = 0; hover.mode = ''; drag.on = false; meas.on = false; canvas.style.cursor = ''; kick(); },
  add: (r, mark) => {   // a plate placed by the demo, as if just drafted
    if (mark) checkpoint();
    rects.push({ lo: r.lo.slice(), hi: r.hi.slice(), h: Math.max(GRID, Math.min(640, r.h)), base: 0, born: performance.now() });
    if (rects.length > MAXB) rects.shift();
    kick();
  },
  resetView: () => { tilt.tgt = 0; orbit.tgt = 0; zoom.tgt = 1; kick(); },
  quiet: v => { quiet = !!v; },
  hint: t => { hintOverride = t; kick(); },
  kick,
};
window.__project = projectWorld;
window.__tstate = () => window.__table.state();
</script>
<script type="module" src="./drive.js"></script>
</body>
</html>
